<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mealquo – zgoda rodzica</title>
  <style>
    body { font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 560px; margin: 0 auto; padding: 32px 18px 60px; color: #1b241f; background: #f6f1ea; }
    h1 { font-size: 26px; letter-spacing: -0.03em; }
    .card { background: #fffdf9; border-radius: 22px; padding: 20px; box-shadow: 0 8px 28px rgba(29, 59, 52, 0.07); margin-top: 18px; }
    .ok { color: #2f7a55; font-weight: 700; } .bad { color: #c45c3e; font-weight: 700; }
    a { color: #1d3b34; }
  </style>
</head>
<body>
<h1>Mealquo</h1>
<div class="card" id="box"><p>Sprawdzam link…</p></div>
<p style="margin-top:18px;font-size:14px;color:#7d847c"><a href="privacy.html">Polityka prywatności</a></p>
<script>
(async () => {
  const lang = (navigator.language || "pl").slice(0, 2);
  const T = (pl, uk, en) => (lang === "uk" ? uk : lang === "en" ? en : pl);
  const box = document.getElementById("box");
  const token = new URLSearchParams(location.search).get("t") || "";
  if (!token) { box.innerHTML = `<p class="bad">${T("Brak linku potwierdzającego.", "Немає посилання для підтвердження.", "No confirmation link.")}</p>`; return; }
  try {
    const res = await fetch("/api/v2/consent/confirm", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }) });
    if (res.ok) {
      box.innerHTML = `<p class="ok">${T("Dziękujemy, zgoda potwierdzona.", "Дякуємо, згоду підтверджено.", "Thank you, consent confirmed.")}</p>
        <p>${T("Konto nastolatka działa w trybie bez diety i celu wagi, z misjami o zdrowych nawykach. Jeśli zmienisz zdanie, konto można usunąć w aplikacji (Profil → Konto) albo pisząc do nas.", "Акаунт підлітка працює без дієти і цілі ваги, з місіями про здорові звички. Якщо передумаєш, акаунт можна видалити в застосунку (Профіль → Акаунт) або написавши нам.", "The teen account runs with no diet or weight goal, with healthy-habit missions. If you change your mind, the account can be deleted in the app (Profile → Account) or by writing to us.")}</p>`;
    } else if (res.status === 404) {
      box.innerHTML = `<p class="bad">${T("Ten link jest nieaktualny.", "Це посилання застаріле.", "This link is no longer valid.")}</p><p>${T("Poproś o nową prośbę z aplikacji.", "Попроси надіслати новий запит із застосунку.", "Ask for a new request from the app.")}</p>`;
    } else {
      box.innerHTML = `<p class="bad">${T("Coś poszło nie tak. Spróbuj za chwilę.", "Щось пішло не так. Спробуй за хвилину.", "Something went wrong. Try again in a moment.")}</p>`;
    }
  } catch (_) {
    box.innerHTML = `<p class="bad">${T("Brak połączenia. Spróbuj za chwilę.", "Немає з’єднання. Спробуй за хвилину.", "No connection. Try again in a moment.")}</p>`;
  }
})();
</script>
</body>
</html>
