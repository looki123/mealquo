plugins { id 'com.android.application' }
apply plugin: 'kotlin-android'

// klucze API z local.properties (poza gitem): GEMINI_KEY, MAPS_KEY
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }

android {
    namespace 'app.mealquo'
    compileSdk 34
    defaultConfig {
        applicationId 'app.mealquo'
        minSdk 26
        targetSdk 34
        versionCode 146
        versionName '14.6'
        buildConfigField 'String', 'GEMINI_KEY', "\"${localProps.getProperty('GEMINI_KEY', '')}\""
        buildConfigField 'String', 'MAPS_KEY', "\"${localProps.getProperty('MAPS_KEY', '')}\""
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha07'
    implementation 'com.android.billingclient:billing:6.2.1'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
