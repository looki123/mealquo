plugins { id 'com.android.application' }

// klucze API z local.properties (poza gitem): GEMINI_KEY, MAPS_KEY
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }

android {
    namespace = 'app.mealquo'
    compileSdk = 37
    defaultConfig {
        applicationId = 'app.mealquo'
        minSdk = 26
        targetSdk = 36
        versionCode = 156
        versionName = '15.6'
        buildConfigField 'String', 'GEMINI_KEY', "\"${localProps.getProperty('GEMINI_KEY', '')}\""
        buildConfigField 'String', 'MAPS_KEY', "\"${localProps.getProperty('MAPS_KEY', '')}\""
        // token aplikacji dla serwera Mealquo (/api/fix, Claude); ten sam jest sekretem APP_TOKEN w Cloudflare
        buildConfigField 'String', 'MEALQUO_TOKEN', "\"${localProps.getProperty('MEALQUO_TOKEN', '')}\""
        // logowanie Google przez Credential Manager: identyfikator klienta WEB z konsoli Google (ten sam, który serwer ma w GOOGLE_CLIENT_IDS); pusty = przycisk ukryty
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', "\"${localProps.getProperty('GOOGLE_WEB_CLIENT_ID', '')}\""
    }
    signingConfigs {
        // Google Play: klucz przesyłania (Play podpisuje potem własnym kluczem aplikacji); dane w local.properties
        upload {
            if (localProps.getProperty('UPLOAD_STORE_FILE')) {
                storeFile = file(localProps.getProperty('UPLOAD_STORE_FILE'))
                storePassword = localProps.getProperty('UPLOAD_STORE_PASSWORD')
                keyAlias = localProps.getProperty('UPLOAD_KEY_ALIAS')
                keyPassword = localProps.getProperty('UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { minifyEnabled = false }
        // wydanie: R8 zmniejsza i optymalizuje kod; podpis ~/.android/debug.keystore jak dotąd,
        // żeby aktualizacje się instalowały, a klucze Google ograniczone do SHA-1 dalej działały
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // -Pplay: paczka do Google Play (klucz przesyłania), bez: APK na GitHub (debug.keystore jak dotąd)
            signingConfig = project.hasProperty('play') ? signingConfigs.upload : signingConfigs.debug
        }
    }
    buildFeatures { buildConfig = true }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.camera:camera-core:1.6.2'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    // logowanie Google (ID token do serwera Mealquo)
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
